replicaCount: 1
appName: user-management
replicas: 1

container:
  containerName: user-management
  containerPort: 9009
  image: user_management
  imagePullPolicy: Never
  env:
    - name: PYTHONPATH
      value: /app
    - name: REDIS_HOST
      value: redis
    - name: REDIS_PORT
      value: "6379"

service:
  type: ClusterIP
  port: 9009
  targetPort: 9009
  name: user-management
