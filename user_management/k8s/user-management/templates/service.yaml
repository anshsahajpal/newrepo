apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default "user-management" }}
spec:
  selector:
    app: {{ .Values.service.name | default "user-management" }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port | default 9009 }}
      targetPort: {{ .Values.service.targetPort | default 9009 }}
  type: {{ .Values.service.type }}