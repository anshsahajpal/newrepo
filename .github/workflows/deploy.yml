name: Deploy Microservices to Kubernetes

on:
  workflow_run:
    workflows: ["pylint", "pytests"]
    types:
      - completed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Images
        run: |
          eval $(minikube docker-env)
          docker build -t user_management:latest -f user_management/Dockerfile .
          docker build -t task_management:latest -f task_management/Dockerfile .
          docker build -t notification:latest -f notifications/Dockerfile .
          docker build -t nginx_gateway:latest -f gateway/Dockerfile .

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy using Helm Charts
        run: |
          helm upgrade --install user-management ./user_management/helm-chart --namespace user-management --create-namespace
          helm upgrade --install task-management ./task_management/helm-chart --namespace task-management --create-namespace
          helm upgrade --install notification ./notifications/helm-chart --namespace notification --create-namespace
          helm upgrade --install nginx-gateway ./gateway/helm-chart --namespace gateway --create-namespace
      