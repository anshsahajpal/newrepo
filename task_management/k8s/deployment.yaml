apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-management
  template:
    metadata:
      labels:
        app: task-management
    spec:
      containers:
        - name: task-management
          image: task_management
          imagePullPolicy: Never
          ports:
            - containerPort: 9001
          env:
            - name: PYTHONPATH
              value: /app
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: task-management
spec:
  selector:
    app: task-management
  ports:
    - protocol: TCP
      port: 9001
      targetPort: 9001
  type: ClusterIP